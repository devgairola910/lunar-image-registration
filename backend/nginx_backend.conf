# Nginx reverse proxy configuration for FastAPI backend on AWS EC2
# Place this file in /etc/nginx/sites-available/chandradrishti
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP; # Replace with your domain (e.g. api.yourdomain.com) or EC2 Elastic IP

    # Increase maximum upload file size for high-resolution lunar images
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
